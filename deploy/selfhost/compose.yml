services:
  egk-hp:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server.env
    volumes:
      - egk-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  egk-data:
